[project]
name = "agentchaos"
version = "0.1.0"
description = "Chaos engineering and reliability testing for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[project.scripts]
agentchaos = "agentchaos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentchaos"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
